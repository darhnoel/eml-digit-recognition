[package]
name = "eml-eval"
version = "0.1.0"
edition = "2024"
description = "Run a pure E-formula, E(x, y) = exp(x) - ln(y), on the MNIST test digits"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
num-complex = "0.4"
rayon = "1"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
